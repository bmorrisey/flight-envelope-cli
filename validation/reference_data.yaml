# Published reference data used by validation/run_validation.py
#
# Rules
#  * Only numbers that were read from a source are recorded here. No chart images or long
#    excerpts are reproduced. Every value carries a citation, its conditions and a confidence:
#      printed      - number printed in the source as text/table output (rounded as printed)
#      chart_read   - read by eye from a published chart (precision given in `tol_abs`)
#      poh_snippet  - POH/AFM table value, seen in search-engine extracts of several
#                     independent copies of the POH. The primary PDF could not be opened from
#                     this session (network policy), so verify it against an original POH.
#      regulation   - regulatory requirement (inequality) from 14 CFR, quoted text verified
#                     via reprints of the CFR
#      rule_of_thumb- FAA handbook approximation (not an exact value)
#  * `ours` says which package output is compared (see run_validation.py:OURS).
#  * `check`: "abs" (|ours - ref| <= tol_abs), "pct" (|err| <= tol_pct), "ge"/"le"
#    (inequality the package result must satisfy), or "info" (reported, no pass/fail).
#  * Speeds: POH speeds are KCAS. At sea level, at these Mach numbers (M < 0.25), CAS and EAS
#    differ by < 0.1 kt, so KCAS is compared directly with the package's KEAS.

sources:
  purdue_aae451:
    citation: >-
      Computational Design (CODE) Laboratory, Purdue University (L. Leifsson et al.),
      "Aircraft Design" Jupyter Book for AAE 451, section "V-n Diagram"
      (book/trade_study/vn_diagram.ipynb), printed cell outputs and final figure.
    url: https://computationaldesignlab.github.io/aircraft-design/trade_study/vn_diagram.html
    repository: https://github.com/computationaldesignlab/aircraft-design
    revision: c405a64140a390e76b908923915ca7041e6cea24 (2025-11-26)
    license: GPL-3.0 (values cited, no content copied)
    access: git clone of the public repository; notebook outputs read directly.
  cessna_172r_poh:
    citation: >-
      Cessna Aircraft Co., Pilot's Operating Handbook and FAA Approved Airplane Flight Manual,
      Model 172R (Skyhawk), Section 2 Limitations (airspeed limitations, flight load factors)
      and Section 5 Performance (stall speeds), 2450 lb maximum weight.
    url: https://wayman.edu/files/172R-POH.pdf (one of several flight-school copies)
    access: >-
      Values from search-engine extracts of the copies at wayman.edu, befa.org and the
      studentpilot.com summary. The PDF itself was not fetched (host blocked).
  cessna_172s_poh:
    citation: >-
      Cessna Aircraft Co., Pilot's Operating Handbook, Model 172S (Skyhawk SP / NAV III),
      Section 2 Limitations and Section 5 Performance, 2550 lb maximum weight.
    url: https://wayman.edu/files/C172S-G1000-POH.pdf (one of several flight-school copies)
    access: >-
      Search-engine extracts of POH copies at wayman.edu, befa.org and greatbasinaviation.com.
      The PDF itself was not fetched (host blocked).
  cessna_172_load_factors:
    citation: >-
      Cessna 172 POH / AFM supplements, Section 2 "Flight Load Factors": normal category,
      flaps up +3.8 g / -1.52 g, flaps down +3.0 g.
    url: https://www.se.edu/aviation/wp-content/uploads/sites/4/2023/11/180hp-STC-POH-Supplement.pdf
    access: Search-engine extracts of several AFM supplements and POHs; not fetched.
  cfr_23_1505:
    citation: >-
      14 CFR 23.1505 (pre-Amendment 23-64), Airspeed limitations: (a) V_NE not more than
      0.9 V_D; (b) V_NO not more than V_C (and not more than 0.89 V_NE).
    url: https://www.law.cornell.edu/cfr/text/14/23.1505
    access: CFR text quoted via reprints (pilotfriend.com, risingup.com); eCFR blocked.
  cfr_23_337:
    citation: >-
      14 CFR 23.337 (pre-Amendment 23-64), Limit maneuvering load factors:
      n >= 2.1 + 24000/(W + 10000), need not exceed 3.8 (normal); n_neg >= 0.4 n (normal).
    url: https://www.govinfo.gov/content/pkg/CFR-2016-title14-vol1/pdf/CFR-2016-title14-vol1-sec23-337.pdf
    access: Formula cross-checked against the Purdue notebook, which quotes it.
  faa_phak_1980:
    citation: >-
      FAA, Pilot's Handbook of Aeronautical Knowledge, AC 61-23 (revised 1980), "Load factors
      in steep turns": a 60 degree bank gives a load factor of 2.
    url: https://rosap.ntl.bts.gov/view/dot/71502/dot_71502_DS1.pdf
    access: Search-engine extract; the same statement is in FAA-H-8083-25C ch. 5 (not fetched, faa.gov blocked).
  faa_ifh:
    citation: >-
      FAA, Instrument Flying Handbook (FAA-H-8083-15B), "Standard rate turns": standard rate
      = 3 deg/s; approximate bank angle = 15 % of TAS (divide by 10, add half the result),
      e.g. 15 deg at 100 KTAS, 18 deg at 120 KTAS.
    url: https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/instrument_flying_handbook
    access: Search-engine extract quoting the handbook text (luizmonteiro.com); faa.gov blocked.

cases:
  # -------------------------------------------------------------------------------------------
  - id: purdue_vn
    title: "Textbook worked example: Purdue AAE 451 V-n diagram (FAR 23, sea level, MTOW, clean)"
    kind: vn
    aircraft: validation/aircraft/purdue_aae451_example.yaml
    altitude_ft: 0
    strength: >-
      Strongest test. All inputs come from the same source, the outputs are printed numbers,
      and the source uses an independent implementation (imperial units, 498 constant).
    references:
      - {quantity: "n+ (23.337)", ours: vn.summary.n_pos_limit, value: 3.58, unit: g,
         confidence: printed, check: abs, tol_abs: 0.005, source: purdue_aae451,
         locator: 'cell "Load factor", output "Positive load factor: 3.58"'}
      - {quantity: "n- (23.337)", ours: vn.summary.n_neg_limit, value: -1.43, unit: g,
         confidence: printed, check: abs, tol_abs: 0.005, source: purdue_aae451,
         locator: 'cell "Load factor", output "Negative load factor: -1.43"'}
      - {quantity: "V_S+ (1 g stall)", ours: vn.summary.vs1, value: 94, unit: KEAS,
         confidence: printed, check: abs, tol_abs: 0.5, source: purdue_aae451,
         locator: 'cell "Speeds", output "Positive stall speed: 94 kts"'}
      - {quantity: "V_S- (-1 g stall)", ours: vn.key_point_x.Vs_neg, value: 110, unit: KEAS,
         confidence: printed, check: abs, tol_abs: 0.5, source: purdue_aae451,
         locator: 'cell "Speeds", output "Negative stall speed: 110 kts"'}
      - {quantity: "V_A (positive corner)", ours: vn.summary.va, value: 179, unit: KEAS,
         confidence: printed, check: abs, tol_abs: 0.5, source: purdue_aae451,
         locator: 'cell "Speeds", output "Corner speed (positive): 179 kts"'}
      - {quantity: "V_G (negative corner)", ours: vn.summary.vg, value: 132, unit: KEAS,
         confidence: printed, check: abs, tol_abs: 0.5, source: purdue_aae451,
         locator: 'cell "Speeds", output "Corner speed (negative): 132 kts"'}
      - {quantity: "n gust +50 ft/s at V_C", ours: vn.summary.n_gust_vc, value: 2.62, unit: g,
         confidence: chart_read, check: abs, tol_abs: 0.05, source: purdue_aae451,
         locator: 'final figure, right end of the "+/-50 ft/s gust line" at V_C = 177 KEAS'}
      - {quantity: "n gust -50 ft/s at V_C", ours: vn.gust_neg.vc, value: -0.62, unit: g,
         confidence: chart_read, check: abs, tol_abs: 0.05, source: purdue_aae451,
         locator: "final figure, lower 50 ft/s gust line at V_C"}
      - {quantity: "n gust +25 ft/s at V_D", ours: vn.summary.n_gust_vd, value: 2.09, unit: g,
         confidence: chart_read, check: abs, tol_abs: 0.05, source: purdue_aae451,
         locator: 'final figure, right end of the "+/-25 ft/s gust line" at V_D = 240 KEAS'}
      - {quantity: "n gust -25 ft/s at V_D (= design n_neg at V_D)", ours: vn.key_point_y.Vd_neg,
         value: -0.09, unit: g, confidence: chart_read, check: abs, tol_abs: 0.05, source: purdue_aae451,
         locator: 'final figure, lower V_D corner; text: "the -25 ft/s gust load factor at V_D exceeds the maneuver load factor"'}
      - {quantity: "positive gust governs? (source: no)", ours: vn.flag.gust_governs_positive,
         value: false, unit: bool, confidence: printed, check: equal, source: purdue_aae451,
         locator: 'closing text: "the gust load factors at other V_C and V_D points are within the maneuver envelope"'}
      - {quantity: "V_A > V_C? (source: yes)", ours: vn.flag.va_above_vc, value: true, unit: bool,
         confidence: printed, check: equal, source: purdue_aae451,
         locator: 'text after "Speeds": "the design cruise speed is less than corner speed (positive)"'}

  # -------------------------------------------------------------------------------------------
  - id: c172_example_vs_172r
    title: "examples/cessna172.yaml (generic, 2450 lb) vs Cessna 172R POH at 2450 lb"
    kind: vn
    aircraft: examples/cessna172.yaml
    altitude_ft: 0
    strength: >-
      Weak, indicative only. The example is a generic 172-like configuration (assumed C_L,max,
      polar and design speeds), not Cessna data, so this tests the inputs as much as the code.
    references:
      - {quantity: "V_S1 (flaps up, power off)", ours: vn.summary.vs1, value: 51, unit: KCAS,
         confidence: poh_snippet, check: pct, tol_pct: 5, source: cessna_172r_poh,
         locator: "Sec. 5 Stall Speeds, flaps up, power off, 2450 lb, 0 deg bank"}
      - {quantity: "V_A at 2450 lb", ours: vn.summary.va, value: 97, unit: KCAS,
         confidence: poh_snippet, check: pct, tol_pct: 5, source: cessna_172r_poh,
         locator: "Sec. 2 Airspeed Limitations, maneuvering speed 2450 lb: 97 KCAS / 99 KIAS"}
      - {quantity: "n+ flaps up", ours: vn.summary.n_pos_limit, value: 3.8, unit: g,
         confidence: poh_snippet, check: abs, tol_abs: 0.001, source: cessna_172_load_factors,
         locator: "Sec. 2 Flight Load Factors (normal category, flaps up)"}
      - {quantity: "n- flaps up", ours: vn.summary.n_neg_limit, value: -1.52, unit: g,
         confidence: poh_snippet, check: abs, tol_abs: 0.001, source: cessna_172_load_factors,
         locator: "Sec. 2 Flight Load Factors (normal category, flaps up)"}
      - {quantity: "V_C >= V_NO (126 KCAS)", ours: vn.summary.vc, value: 126, unit: KCAS,
         confidence: regulation, check: ge, source: cfr_23_1505,
         locator: "23.1505(b) with POH V_NO = 126 KCAS / 129 KIAS"}
      - {quantity: "V_D >= V_NE / 0.9 (160/0.9 KCAS)", ours: vn.summary.vd, value: 177.8, unit: KCAS,
         confidence: regulation, check: ge, source: cfr_23_1505,
         locator: "23.1505(a)(2)(i) with POH V_NE = 160 KCAS / 163 KIAS"}

  # -------------------------------------------------------------------------------------------
  - id: c172r_calibrated
    title: "validation/aircraft/cessna172r_poh_calibrated.yaml vs Cessna 172R POH at 2450 lb"
    kind: vn
    aircraft: validation/aircraft/cessna172r_poh_calibrated.yaml
    altitude_ft: 0
    strength: >-
      V_S1, V_C and V_D were set from the POH (circular, so not scored). V_A is independent:
      the package derives it from V_S1 and n = 3.8 (V_A = V_S1 sqrt(n)), and Cessna published it.
    references:
      - {quantity: "V_S1 (calibration input)", ours: vn.summary.vs1, value: 51, unit: KCAS,
         confidence: poh_snippet, check: info, source: cessna_172r_poh,
         locator: "Sec. 5 Stall Speeds, flaps up, 2450 lb (used to set C_L,max = 1.595)"}
      - {quantity: "V_A at 2450 lb", ours: vn.summary.va, value: 97, unit: KCAS,
         confidence: poh_snippet, check: pct, tol_pct: 5, source: cessna_172r_poh,
         locator: "Sec. 2 Airspeed Limitations, maneuvering speed 2450 lb"}
      - {quantity: "V_C >= V_NO (126 KCAS)", ours: vn.summary.vc, value: 126, unit: KCAS,
         confidence: regulation, check: ge, source: cfr_23_1505, locator: "23.1505(b)"}
      - {quantity: "V_D >= V_NE / 0.9", ours: vn.summary.vd, value: 177.8, unit: KCAS,
         confidence: regulation, check: ge, source: cfr_23_1505, locator: "23.1505(a)"}
      - {quantity: "Doghouse corner speed (= V_A at SL)", ours: turn.summary.v_corner, value: 97,
         unit: KCAS, confidence: poh_snippet, check: pct, tol_pct: 5, source: cessna_172r_poh,
         locator: "Sec. 2 maneuvering speed; at sea level the corner (C_L,max meets n_limit) is V_A in TAS"}

  # -------------------------------------------------------------------------------------------
  - id: c172s_weight_scaling
    title: "V_A and V_S1 weight scaling vs Cessna 172S POH (examples/cessna172.yaml re-weighted)"
    kind: vn_mass_sweep
    aircraft: examples/cessna172.yaml
    altitude_ft: 0
    strength: >-
      Tests the sqrt(W) dependence of V_A, independent of the absolute C_L,max. Ratios use the
      KIAS values the POH publishes. Instrument error makes the KIAS ratios differ slightly
      from the KCAS ratios.
    references:
      - {quantity: "V_A(2200 lb) / V_A(2550 lb)", ours: "vn.ratio.va:2200lb/2550lb", value: 0.93333,
         unit: "-", confidence: poh_snippet, check: pct, tol_pct: 1.5, source: cessna_172s_poh,
         locator: "Sec. 2 maneuvering speed: 105 KIAS @ 2550 lb, 98 KIAS @ 2200 lb (98/105)"}
      - {quantity: "V_A(1900 lb) / V_A(2550 lb)", ours: "vn.ratio.va:1900lb/2550lb", value: 0.85714,
         unit: "-", confidence: poh_snippet, check: pct, tol_pct: 1.5, source: cessna_172s_poh,
         locator: "Sec. 2 maneuvering speed: 90 KIAS @ 1900 lb (90/105)"}
      - {quantity: "V_S1 at 2550 lb", ours: "vn.at_mass.vs1:2550lb", value: 53, unit: KCAS,
         confidence: poh_snippet, check: pct, tol_pct: 5, source: cessna_172s_poh,
         locator: "Sec. 5 Stall Speeds, flaps up, power off, 2550 lb: 53 KCAS"}

  # -------------------------------------------------------------------------------------------
  - id: turn_kinematics
    title: "Coordinated level-turn kinematics vs FAA handbooks"
    kind: kinematics
    strength: Exact relations (60 deg -> 2 g) and FAA rules of thumb (standard-rate bank angle).
    references:
      - {quantity: "n at 60 deg bank", ours: "kin.load_factor_from_bank:60", value: 2.0, unit: g,
         confidence: printed, check: abs, tol_abs: 0.005, source: faa_phak_1980,
         locator: "Load factors in steep turns (60 deg bank -> 2 G)"}
      - {quantity: "Standard-rate (3 deg/s) bank at 100 KTAS", ours: "kin.std_rate_bank:100", value: 15,
         unit: deg, confidence: rule_of_thumb, check: abs, tol_abs: 1.0, source: faa_ifh,
         locator: "Standard rate turn, 15 % of TAS rule, example 100 kt -> 15 deg"}
      - {quantity: "Standard-rate (3 deg/s) bank at 120 KTAS", ours: "kin.std_rate_bank:120", value: 18,
         unit: deg, confidence: rule_of_thumb, check: abs, tol_abs: 1.0, source: faa_ifh,
         locator: "Standard rate turn, 15 % of TAS rule, example 120 kt -> 18 deg"}

# Searched for, NOT used (no primary or verifiable source reachable from this session):
not_used:
  - item: F-16 E-M / doghouse (corner speed, max instantaneous / sustained turn rate)
    reason: >-
      Only forum posts and blogs were found (f-16.net, DCS forums, boltflight.com). Their
      figures conflict (about 21.6 to 25.5 deg/s instantaneous, about 17.7 deg/s sustained at
      SL) and state no weight or drag index. The DTIC E-M reports found (e.g. ADA092974) are
      generic. No value is recorded; examples/f16.yaml stays unvalidated.
  - item: Cessna 172 stall speed vs bank angle table (POH Sec. 5)
    reason: >-
      The NTSB docket copies (data.ntsb.gov) came back with scrambled table text in the
      extracts, and the PDFs could not be fetched.
  - item: FAA PHAK (FAA-H-8083-25C) V-g diagram values
    reason: www.faa.gov unreachable from this session; figure values not verifiable.
  - item: Johnson, Aerospace Structures, ch. 2 V-n example (mu_g = 149, K_g = 0.85)
    reason: The input data (its Fig. 2.22) could not be retrieved, so the example cannot be rebuilt.
